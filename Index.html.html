<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Stark Industries</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#00d4ff;--bg:#0a0e1a;--card:rgba(0,212,255,0.03);--orange:#ff6b35}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:#e0e0e0;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.font-orb{font-family:'Orbitron',monospace}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,255,0.015) 2px,rgba(0,212,255,0.015) 4px);z-index:9999}
.arc{width:36px;height:36px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
.arc .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--primary);opacity:0.4;animation:pulse 2s ease-in-out infinite}
.arc .ring:nth-child(2){inset:4px;animation-delay:0.3s;opacity:0.6}
.arc .core{width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 15px var(--primary),0 0 30px var(--primary)}
.arc.active .ring{animation:pulse 0.8s ease-in-out infinite}
.arc.active .core{box-shadow:0 0 20px var(--primary),0 0 40px var(--primary),0 0 60px var(--primary)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.4}50%{transform:scale(1.1);opacity:0.8}}
.hud{background:var(--card);border:1px solid rgba(0,212,255,0.12);position:relative;padding:10px;display:flex;flex-direction:column}
.hud::before{content:'';position:absolute;top:0;left:0;width:20px;height:20px;border-top:2px solid var(--primary);border-left:2px solid var(--primary);opacity:0.5}
.hud::after{content:'';position:absolute;bottom:0;right:0;width:20px;height:20px;border-bottom:2px solid var(--primary);border-right:2px solid var(--primary);opacity:0.5}
.hud-title{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--primary);opacity:0.6;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.hud-title::before{content:'';flex:0 0 auto;width:4px;height:4px;background:var(--primary);opacity:0.5}
#chat{flex:1;overflow-y:auto;min-height:0;padding-right:4px}
#chat::-webkit-scrollbar{width:3px}
#chat::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.2);border-radius:2px}
.msg{margin-bottom:12px;animation:slideUp 0.3s ease}
.msg-label{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.msg-label.jarvis{color:var(--primary)}
.msg-label.user{color:var(--orange)}
.msg-text{font-size:14px;line-height:1.6;padding-left:2px}
.msg-text.jarvis{color:rgba(0,212,255,0.9)}
.msg-text.user{color:#e0e0e0}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.input-bar{display:flex;align-items:center;gap:8px;margin-top:8px}
.input-bar button{background:rgba(0,212,255,0.05);border:1px solid rgba(0,212,255,0.3);color:rgba(0,212,255,0.6);width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s}
.input-bar button:hover{color:var(--primary);border-color:rgba(0,212,255,0.5)}
.input-bar button.listening{border-color:var(--orange);background:rgba(255,107,53,0.1);color:var(--orange);box-shadow:0 0 15px rgba(255,107,53,0.3)}
.input-wrap{flex:1;display:flex;align-items:center;border:1px solid rgba(0,212,255,0.2);background:rgba(0,212,255,0.02)}
.input-wrap span{padding-left:10px;color:rgba(0,212,255,0.4);font-family:'Orbitron',monospace;font-size:12px}
.input-wrap input{flex:1;background:transparent;border:none;padding:9px 8px;color:#e0e0e0;font-family:'Rajdhani',sans-serif;font-size:14px;outline:none}
.input-wrap input::placeholder{color:rgba(255,255,255,0.25)}
.input-wrap button{background:none;border:none;color:rgba(0,212,255,0.5);cursor:pointer;padding:9px;transition:color 0.3s}
.input-wrap button:hover{color:var(--primary)}
.qa-btn{width:100%;padding:6px 8px;background:rgba(0,212,255,0.05);border:1px solid rgba(0,212,255,0.15);color:rgba(0,212,255,0.7);font-family:'Rajdhani',sans-serif;font-size:12px;text-align:left;cursor:pointer;transition:all 0.2s;margin-bottom:4px}
.qa-btn:hover{background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.3);color:var(--primary)}
.stat{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.stat-label{color:rgba(255,255,255,0.4)}
.stat-val{font-family:'Orbitron',monospace}
.stat-val.cyan{color:var(--primary)}
.stat-val.orange{color:var(--orange)}
.processing{display:flex;align-items:center;gap:6px;font-family:'Orbitron',monospace;font-size:11px;color:rgba(0,212,255,0.5)}
.processing .dot{width:5px;height:5px;border-radius:50%;background:var(--primary);animation:pulse 0.8s ease-in-out infinite}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid rgba(0,212,255,0.1)}
.main{flex:1;display:flex;gap:12px;padding:12px;overflow:hidden}
aside{width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
main{flex:1;display:flex;flex-direction:column;min-height:0}
footer{padding:4px 16px;border-top:1px solid rgba(0,212,255,0.08);display:flex;justify-content:space-between;font-family:'Orbitron',monospace;font-size:9px;color:rgba(255,255,255,0.3)}
.footer-conn{display:flex;align-items:center;gap:4px}
.footer-conn .dot{width:4px;height:4px;border-radius:50%;background:var(--primary);animation:pulse 2s ease-in-out infinite}
@media(max-width:768px){aside{display:none}}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="arc" id="reactor"><div class="ring"></div><div class="ring"></div><div class="core"></div></div>
    <div>
      <div class="font-orb" style="font-size:13px;color:var(--primary);letter-spacing:4px">J.A.R.V.I.S.</div>
      <div style="font-size:10px;color:rgba(255,255,255,0.35)">Just A Rather Very Intelligent System</div>
    </div>
  </div>
  <div style="text-align:right">
    <div class="font-orb" style="font-size:11px;color:rgba(0,212,255,0.6)" id="clock"></div>
    <div style="font-size:10px;color:rgba(255,255,255,0.35);text-transform:capitalize" id="date"></div>
  </div>
</header>

<div class="main">
  <aside>
    <div class="hud">
      <div class="hud-title">Estado del Sistema</div>
      <div class="stat"><span class="stat-label">Reactor Arc</span><span class="stat-val cyan">98.7%</span></div>
      <div class="stat"><span class="stat-label">Escudo Perimetral</span><span class="stat-val cyan">ACTIVO</span></div>
      <div class="stat"><span class="stat-label">Armaduras Online</span><span class="stat-val orange">12/15</span></div>
      <div class="stat"><span class="stat-label">IA Core Temp</span><span class="stat-val cyan">42.3°C</span></div>
    </div>
    <div class="hud">
      <div class="hud-title">Acciones Rápidas</div>
      <button class="qa-btn" onclick="sendMsg('Reporte completo del estado de todos los sistemas')">⚡ Estado de Sistemas</button>
      <button class="qa-btn" onclick="sendMsg('Explícame los últimos avances en física cuántica')">🔬 Física Cuántica</button>
      <button class="qa-btn" onclick="sendMsg('Activa el protocolo de defensa perimetral')">🛡️ Protocolo de Defensa</button>
    </div>
  </aside>

  <main>
    <div class="hud" style="flex:1;min-height:0;display:flex;flex-direction:column">
      <div class="hud-title">Terminal de Comunicación</div>
      <div id="chat"></div>
    </div>
    <div class="input-bar">
      <button id="micBtn" onclick="toggleMic()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      </button>
      <div class="input-wrap">
        <span>&gt;</span>
        <input id="input" placeholder="Escriba su comando, Señor..." onkeydown="if(event.key==='Enter')send()">
        <button onclick="send()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4z"/><path d="m22 2-11 11"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<footer>
  <span>STARK INDUSTRIES — NIVEL DE SEGURIDAD: ALFA</span>
  <span class="footer-conn"><span class="dot"></span>CONEXIÓN SEGURA</span>
</footer>

<script>
const API_URL = "https://bqwrirfzqhnjamyittzz.supabase.co/functions/v1/jarvis-chat";
const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxd3JpcmZ6cWhuamFteWl0dHp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMDAyNTMsImV4cCI6MjA5MTg3NjI1M30.8RxvGRsjI3DUVKrYo_rx4rdmbefYr_Qe6uJeW5_mecY";

let messages = [];
let isLoading = false;
let isListening = false;
let recognition = null;
let jarvisVoice = null;

// Find the best male Spanish voice
function findMaleVoice(){
  const voices = speechSynthesis.getVoices();
  // Priority: look for explicitly male Spanish voices
  const maleKeywords = ['male','hombre','jorge','carlos','pablo','diego','andrés','andres','enrique','juan','pedro','daniel','microsoft pablo','google español'];
  const femaleKeywords = ['female','mujer','maria','maría','laura','elena','lucia','lucía','paulina','mónica','monica','microsoft helena','microsoft laura','microsoft sabina','conchita','penélope','penelope','lupe'];
  
  // First pass: find Spanish voices that are explicitly male
  for(const v of voices){
    if(!v.lang.startsWith('es')) continue;
    const n = v.name.toLowerCase();
    const isFemale = femaleKeywords.some(k => n.includes(k));
    if(isFemale) continue;
    const isMale = maleKeywords.some(k => n.includes(k));
    if(isMale){ jarvisVoice = v; return; }
  }
  
  // Second pass: any Spanish voice that is NOT female
  for(const v of voices){
    if(!v.lang.startsWith('es')) continue;
    const n = v.name.toLowerCase();
    const isFemale = femaleKeywords.some(k => n.includes(k));
    if(!isFemale){ jarvisVoice = v; return; }
  }
  
  // Third pass: any English male voice as fallback
  for(const v of voices){
    if(!v.lang.startsWith('en')) continue;
    const n = v.name.toLowerCase();
    const isMale = maleKeywords.some(k => n.includes(k)) || n.includes('daniel') || n.includes('james') || n.includes('google uk english male');
    if(isMale){ jarvisVoice = v; return; }
  }
  
  // Last resort: first Spanish voice
  jarvisVoice = voices.find(v => v.lang.startsWith('es')) || null;
}

// Load voices (async on some browsers)
if(window.speechSynthesis){
  findMaleVoice();
  speechSynthesis.onvoiceschanged = () => findMaleVoice();
}

// Clock
function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('date').textContent = now.toLocaleDateString('es-ES',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
updateClock(); setInterval(updateClock, 1000);

addMessage('assistant', 'Buenas tardes, Señor. Todos los sistemas operativos. ¿En qué puedo asistirle hoy?');

function stripMd(t){
  return t.replace(/\*+/g,' ').replace(/#{1,6}\s?/g,' ').replace(/`{1,3}/g,' ').replace(/[\[\]{}()<>_|~]/g,' ').replace(/https?:\/\/\S+/g,' ').replace(/\s+/g,' ').trim();
}

function addMessage(role, content){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg';
  const isJ = role === 'assistant';
  div.innerHTML = '<div class="msg-label '+(isJ?'jarvis':'user')+'">'+(isJ?'J.A.R.V.I.S.':'Señor')+'</div><p class="msg-text '+(isJ?'jarvis':'user')+'">'+stripMd(content)+'</p>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function updateLastAssistant(content){
  const chat = document.getElementById('chat');
  const msgs = chat.querySelectorAll('.msg');
  const last = msgs[msgs.length - 1];
  if(last){ last.querySelector('.msg-text').textContent = stripMd(content); chat.scrollTop = chat.scrollHeight; }
}

function showProcessing(){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.id = 'processing'; div.className = 'processing';
  div.innerHTML = '<span class="dot"></span>Procesando...';
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
}
function hideProcessing(){const p=document.getElementById('processing');if(p)p.remove();}

function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES';
  u.pitch = 0.7;
  u.rate = 0.95;
  if(jarvisVoice) u.voice = jarvisVoice;
  speechSynthesis.speak(u);
}

function playBeep(){
  try{
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine'; osc.frequency.value = 1200;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start(); osc.stop(ctx.currentTime + 0.15);
  }catch(e){}
}

async function sendMsg(text){
  if(!text.trim()||isLoading) return;
  document.getElementById('input').value = '';
  const userMsg = {role:'user',content:text};
  messages.push(userMsg);
  addMessage('user',text);
  isLoading = true;
  document.getElementById('reactor').classList.add('active');
  showProcessing();
  let assistantText = '';
  let assistantDiv = null;
  try{
    const resp = await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
      body:JSON.stringify({messages:messages.map(m=>({role:m.role,content:m.content}))})
    });
    if(!resp.ok||!resp.body) throw new Error('Error en conexión');
    hideProcessing();
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buffer += decoder.decode(value,{stream:true});
      let idx;
      while((idx=buffer.indexOf('\n'))!==-1){
        let line=buffer.slice(0,idx);
        buffer=buffer.slice(idx+1);
        if(line.endsWith('\r'))line=line.slice(0,-1);
        if(!line.startsWith('data: '))continue;
        const json=line.slice(6).trim();
        if(json==='[DONE]')break;
        try{
          const parsed=JSON.parse(json);
          const content=parsed.choices?.[0]?.delta?.content;
          if(content){
            assistantText+=content;
            if(!assistantDiv){assistantDiv=addMessage('assistant',assistantText);}
            else{updateLastAssistant(assistantText);}
          }
        }catch(e){}
      }
    }
    if(assistantText) messages.push({role:'assistant',content:assistantText});
    speak(stripMd(assistantText));
  }catch(e){
    hideProcessing();
    const err = 'Disculpe, Señor. He experimentado una interrupción en mis sistemas.';
    addMessage('assistant',err);
    messages.push({role:'assistant',content:err});
  }finally{
    isLoading=false;
    document.getElementById('reactor').classList.remove('active');
  }
}

function send(){sendMsg(document.getElementById('input').value);}

function toggleMic(){
  if(isListening){stopMic();return;}
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Tu navegador no soporta reconocimiento de voz');return;}
  playBeep();
  recognition = new SR();
  recognition.lang = 'es-ES';
  recognition.interimResults = false;
  recognition.onresult = e => {const t=e.results[0][0].transcript;stopMic();sendMsg(t);};
  recognition.onerror = () => stopMic();
  recognition.onend = () => stopMic();
  recognition.start();
  isListening = true;
  document.getElementById('micBtn').classList.add('listening');
  document.getElementById('reactor').classList.add('active');
}
function stopMic(){
  if(recognition){try{recognition.stop();}catch(e){}}
  isListening = false;
  document.getElementById('micBtn').classList.remove('listening');
  if(!isLoading) document.getElementById('reactor').classList.remove('active');
}
</script>
</body>
</html>
